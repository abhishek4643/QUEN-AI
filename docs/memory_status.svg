<svg width="100%" height="100%" viewBox="0 0 960 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-anchor: middle; }
      .header-val { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #F0F6FC; }
      .subtext { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #8B949E; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="960" height="140" rx="14" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />

  <!-- Card 1: Last Updated -->
  <g transform="translate(24, 18)">
    <rect width="288" height="104" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="18" y="16" width="104" height="20" rx="10" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
    <text x="70" y="30" class="label" fill="#818CF8">LAST UPDATED</text>
    <text x="18" y="68" class="header-val">October 31, 2026</text>
    <text x="18" y="90" class="subtext">13:30 IST &bull; Production Ready</text>
  </g>

  <!-- Card 2: Current Phase -->
  <g transform="translate(336, 18)">
    <rect width="288" height="104" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="18" y="16" width="110" height="20" rx="10" fill="#2E1065" stroke="#8B5CF6" stroke-width="1" />
    <text x="73" y="30" class="label" fill="#C084FC">CURRENT PHASE</text>
    <text x="18" y="68" class="header-val">Phase 5: Release</text>
    <text x="18" y="90" class="subtext" fill="#A855F7">Production &amp; Benchmark Verified</text>
  </g>

  <!-- Card 3: Verification Status -->
  <g transform="translate(648, 18)">
    <rect width="288" height="104" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="18" y="16" width="100" height="20" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1" />
    <text x="68" y="30" class="label" fill="#34D399">VERIFICATION</text>
    <text x="18" y="68" class="header-val">100.0% Pass Rate</text>
    <text x="18" y="90" class="subtext" fill="#10B981">43 / 43 MBPP Benchmark</text>
  </g>
</svg>

