<svg width="100%" height="100%" viewBox="0 0 960 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-anchor: middle; }
      .number { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 32px; font-weight: 800; fill: #F0F6FC; }
      .subtext { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #8B949E; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="960" height="140" rx="14" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />

  <!-- Card 1: Total Tasks -->
  <g transform="translate(24, 18)">
    <rect width="288" height="104" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" filter="url(#card-shadow)" />
    <!-- Blue Badge -->
    <rect x="18" y="16" width="96" height="20" rx="10" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
    <text x="66" y="30" class="label" fill="#818CF8">TOTAL TASKS</text>
    <text x="18" y="74" class="number">24</text>
    <text x="18" y="94" class="subtext">100% scoped &amp; defined</text>
  </g>

  <!-- Card 2: Completed -->
  <g transform="translate(336, 18)">
    <rect width="288" height="104" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" filter="url(#card-shadow)" />
    <!-- Green Badge -->
    <rect x="18" y="16" width="90" height="20" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1" />
    <text x="63" y="30" class="label" fill="#34D399">COMPLETED</text>
    <text x="18" y="74" class="number">24</text>
    <!-- Progress Bar -->
    <rect x="80" y="58" width="190" height="8" rx="4" fill="#1E293B" />
    <rect x="80" y="58" width="190" height="8" rx="4" fill="#10B981" />
    <text x="18" y="94" class="subtext" fill="#34D399" font-weight="600">100% verified &bull; 43/43 MBPP</text>
  </g>

  <!-- Card 3: In Progress -->
  <g transform="translate(648, 18)">
    <rect width="288" height="104" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" filter="url(#card-shadow)" />
    <!-- Orange Badge -->
    <rect x="18" y="16" width="98" height="20" rx="10" fill="#78350F" stroke="#F59E0B" stroke-width="1" />
    <text x="67" y="30" class="label" fill="#FDE68A">IN PROGRESS</text>
    <text x="18" y="74" class="number">0</text>
    <text x="18" y="94" class="subtext">Ready for release &amp; serving</text>
  </g>
</svg>

